<script>
(function() {
    // 等待播放器初始化完成
    var initTimer = setInterval(function() {
        var playerContainer = document.getElementById('persistent-music-player');
        if (!playerContainer) return;

        var aplayerBody = playerContainer.querySelector('.aplayer.aplayer-fixed .aplayer-body');
        var aplayerList = playerContainer.querySelector('.aplayer.aplayer-fixed .aplayer-list');
        var aplayerButton = playerContainer.querySelector('.aplayer-button');

        if (!aplayerBody) return;

        clearInterval(initTimer);

        // 添加拖拽样式和过渡动画
        aplayerBody.style.cursor = 'grab';
        aplayerBody.style.userSelect = 'none';
        aplayerBody.style.transition = 'left 0.3s ease, bottom 0.15s ease';
        if (aplayerList) {
            aplayerList.style.transition = 'left 0.3s ease, bottom 0.15s ease';
        }
        if (aplayerButton) {
            aplayerButton.style.cursor = 'pointer';
        }

        // 拖拽状态
        var isDragging = false;
        var startX, startY;
        var startBottom;
        var currentBottom = 20; // vh 单位，始终在左侧

        // 更新播放器和列表位置（垂直方向）
        function updateVerticalPosition(bottomVh) {
            bottomVh = Math.max(5, Math.min(bottomVh, 90));
            currentBottom = bottomVh;

            // 始终在左侧
            aplayerBody.style.left = '0px';
            aplayerBody.style.bottom = bottomVh + 'vh';

            if (aplayerList) {
                aplayerList.style.left = '0px';
                aplayerList.style.bottom = 'calc(' + bottomVh + 'vh + 66px)';
            }

            // 只保存垂直位置
            try {
                localStorage.setItem('aplayer_bottom', bottomVh);
            } catch(e) {}
        }

        // 拖拽时的临时位置（允许左右移动）
        function setDragPosition(leftPx, bottomVh) {
            var maxLeft = window.innerWidth - 66;
            leftPx = Math.max(0, Math.min(leftPx, maxLeft));
            bottomVh = Math.max(5, Math.min(bottomVh, 90));

            // 拖拽时禁用过渡动画
            aplayerBody.style.transition = 'none';
            if (aplayerList) {
                aplayerList.style.transition = 'none';
            }

            aplayerBody.style.left = leftPx + 'px';
            aplayerBody.style.bottom = bottomVh + 'vh';

            if (aplayerList) {
                aplayerList.style.left = leftPx + 'px';
                aplayerList.style.bottom = 'calc(' + bottomVh + 'vh + 66px)';
            }
        }

        // 吸附回左侧
        function snapToLeft(bottomVh) {
            // 启用过渡动画
            aplayerBody.style.transition = 'left 0.3s ease, bottom 0.15s ease';
            if (aplayerList) {
                aplayerList.style.transition = 'left 0.3s ease, bottom 0.15s ease';
            }

            updateVerticalPosition(bottomVh);
        }

        // 恢复保存的位置
        function restorePosition() {
            try {
                var savedBottom = localStorage.getItem('aplayer_bottom');
                if (savedBottom) {
                    updateVerticalPosition(parseFloat(savedBottom));
                }
            } catch(e) {}
        }

        setTimeout(restorePosition, 500);

        // 鼠标/触摸事件处理
        function onDragStart(e) {
            if (e.target.closest && e.target.closest('.aplayer-button')) return;
            if (e.target.classList && e.target.classList.contains('aplayer-button')) return;

            isDragging = true;
            aplayerBody.style.cursor = 'grabbing';
            startBottom = currentBottom;

            if (e.type === 'touchstart') {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
            }

            e.preventDefault();
        }

        function onDragMove(e) {
            if (!isDragging) return;

            var clientX, clientY;
            if (e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            var deltaX = clientX - startX;
            var deltaY = startY - clientY;

            var vhPerPixel = 100 / window.innerHeight;
            var deltaVh = deltaY * vhPerPixel;

            setDragPosition(deltaX, startBottom + deltaVh);
            e.preventDefault();
        }

        function onDragEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            aplayerBody.style.cursor = 'grab';

            // 获取当前拖拽后的垂直位置
            var currentBottomVh = parseFloat(aplayerBody.style.bottom) || currentBottom;
            snapToLeft(currentBottomVh);
        }

        // 绑定事件
        aplayerBody.addEventListener('mousedown', onDragStart);
        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('mouseup', onDragEnd);

        aplayerBody.addEventListener('touchstart', onDragStart, { passive: false });
        document.addEventListener('touchmove', onDragMove, { passive: false });
        document.addEventListener('touchend', onDragEnd);
    }, 100);
})();
</script>

<script type="text/javascript">
$(function () {
    var searchFunc = function (path, search_id, content_id) {
        'use strict';
        $.ajax({
            url: path,
            dataType: "xml",
            success: function (xmlResponse) {
                // get the contents from search data
                var datas = $("entry", xmlResponse).map(function () {
                    return {
                        title: $("title", this).text(),
                        content: $("content", this).text(),
                        url: $("url", this).text()
                    };
                }).get();
                var $input = document.getElementById(search_id);
                var $resultContent = document.getElementById(content_id);
                $input.addEventListener('input', function () {
                    var str = '<ul class=\"search-result-list\">';
                    var keywords = this.value.trim().toLowerCase().split(/[\s\-]+/);
                    $resultContent.innerHTML = "";
                    if (this.value.trim().length <= 0) {
                        return;
                    }
                    // perform local searching
                    datas.forEach(function (data) {
                        var isMatch = true;
                        var data_title = data.title.trim().toLowerCase();
                        var data_content = data.content.trim().replace(/<[^>]+>/g, "").toLowerCase();
                        var data_url = data.url;
                        data_url = data_url.indexOf('/') === 0 ? data.url : '/' + data_url;
                        var index_title = -1;
                        var index_content = -1;
                        var first_occur = -1;
                        // only match artiles with not empty titles and contents
                        if (data_title !== '' && data_content !== '') {
                            keywords.forEach(function (keyword, i) {
                                index_title = data_title.indexOf(keyword);
                                index_content = data_content.indexOf(keyword);
                                if (index_title < 0 && index_content < 0) {
                                    isMatch = false;
                                } else {
                                    if (index_content < 0) {
                                        index_content = 0;
                                    }
                                    if (i === 0) {
                                        first_occur = index_content;
                                    }
                                }
                            });
                        }
                        // show search results
                        if (isMatch) {
                            str += "<li><a href='" + data_url + "' class='search-result-title'>" + data_title + "</a>";
                            var content = data.content.trim().replace(/<[^>]+>/g, "");
                            if (first_occur >= 0) {
                                // cut out 100 characters
                                var start = first_occur - 20;
                                var end = first_occur + 80;
                                if (start < 0) {
                                    start = 0;
                                }
                                if (start === 0) {
                                    end = 100;
                                }
                                if (end > content.length) {
                                    end = content.length;
                                }
                                var match_content = content.substr(start, end);
                                // highlight all keywords
                                keywords.forEach(function (keyword) {
                                    var regS = new RegExp(keyword, "gi");
                                    match_content = match_content.replace(regS, "<em class=\"search-keyword\">" + keyword + "</em>");
                                });

                                str += "<p class=\"search-result\">" + match_content + "...</p>"
                            }
                            str += "</li>";
                        }
                    });
                    str += "</ul>";
                    $resultContent.innerHTML = str;
                });
            }
        });
    };

    searchFunc('/search.xml', 'searchInput', 'searchResult');
});
</script>

    <script>
        (function () {
            var navigating = false;
            var containerId = 'site-page-content';

            function isMusicPage(doc) {
                return doc.body && doc.body.getAttribute('data-music-page') === 'true';
            }

            var musicPagePauseTimer;

            function stopPersistentPlayer() {
                var playerContainer = document.getElementById('persistent-music-player');
                if (!playerContainer) return;

                // 方法1：通过 meting-js 元素的 aplayer 属性获取实例
                var metingElement = playerContainer.querySelector('meting-js[data-persistent-player="true"]');
                if (metingElement && metingElement.aplayer && typeof metingElement.aplayer.pause === 'function') {
                    metingElement.aplayer.pause();
                }

                // 方法2：通过 window.aplayers 获取所有实例并暂停首页播放器
                if (window.aplayers && window.aplayers.length) {
                    window.aplayers.forEach(function (instance) {
                        if (instance && instance.container && playerContainer.contains(instance.container) && typeof instance.pause === 'function') {
                            instance.pause();
                        }
                    });
                }

                // 方法3：直接暂停所有音频元素
                Array.prototype.forEach.call(playerContainer.querySelectorAll('audio'), function (audio) {
                    audio.autoplay = false;
                    audio.removeAttribute('autoplay');
                    audio.pause();
                });

                // 方法4：尝试通过 .aplayer 类获取实例（兼容性）
                var aplayerDiv = playerContainer.querySelector('.aplayer');
                if (aplayerDiv && aplayerDiv.aplayer && typeof aplayerDiv.aplayer.pause === 'function') {
                    aplayerDiv.aplayer.pause();
                }
            }

            function setMusicPageState(onMusicPage) {
                var player = document.getElementById('persistent-music-player');
                document.body.setAttribute('data-music-page', onMusicPage ? 'true' : 'false');
                window.clearInterval(musicPagePauseTimer);
                if (!player) return;
                player.setAttribute('data-music-page', onMusicPage ? 'true' : 'false');
                if (onMusicPage) {
                    stopPersistentPlayer();
                    musicPagePauseTimer = window.setInterval(stopPersistentPlayer, 100);
                }
            }

            document.addEventListener('play', function (event) {
                var target = event.target;
                if (document.body.getAttribute('data-music-page') === 'true' && target.closest && target.closest('#persistent-music-player')) {
                    target.pause();
                }
            }, true);

            function runScripts(root) {
                Array.prototype.forEach.call(root.querySelectorAll('script'), function (oldScript) {
                    var script = document.createElement('script');
                    Array.prototype.forEach.call(oldScript.attributes, function (attr) {
                        script.setAttribute(attr.name, attr.value);
                    });
                    script.text = oldScript.text;
                    oldScript.parentNode.replaceChild(script, oldScript);
                });
            }

            function navigate(url, push) {
                if (navigating) return;
                navigating = true;
                fetch(url, { credentials: 'same-origin' })
                    .then(function (response) {
                        if (!response.ok) throw new Error('Navigation failed');
                        return response.text();
                    })
                    .then(function (html) {
                        var next = new DOMParser().parseFromString(html, 'text/html');
                        var nextContent = next.getElementById(containerId);
                        var currentContent = document.getElementById(containerId);
                        if (!nextContent || !currentContent) {
                            window.location.href = url;
                            return;
                        }
                        currentContent.innerHTML = nextContent.innerHTML;
                        document.title = next.title;
                        setMusicPageState(isMusicPage(next));
                        if (push) history.pushState({}, '', url);
                        window.scrollTo(0, 0);
                        runScripts(currentContent);
                        document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
                    })
                    .catch(function () { window.location.href = url; })
                    .finally(function () { navigating = false; });
            }

            document.addEventListener('click', function (event) {
                var link = event.target.closest && event.target.closest('a[href]');
                if (!link || event.defaultPrevented || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
                var url = new URL(link.href, window.location.href);
                if (url.origin !== window.location.origin || link.target || link.hasAttribute('download') || url.pathname === window.location.pathname && url.search === window.location.search && url.hash) return;
                if (/\/musics\/?$/.test(url.pathname)) {
                    document.body.setAttribute('data-music-page', 'true');
                    Array.prototype.forEach.call(document.querySelectorAll('audio'), function (audio) {
                        audio.pause();
                    });
                    stopPersistentPlayer();
                    window.clearInterval(musicPagePauseTimer);
                    musicPagePauseTimer = window.setInterval(stopPersistentPlayer, 50);
                }
                event.preventDefault();
                navigate(url.href, true);
            });

            window.addEventListener('popstate', function () { navigate(window.location.href, false); });
            setMusicPageState(document.body.getAttribute('data-music-page') === 'true');
        })();
    </script>
    

</body>
